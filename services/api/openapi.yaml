      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Joined }
        "200": { description: Already a member }
        "403": { $ref: "#/components/responses/Error" }
  /v1/communities/{id}/posts:
    get:
      tags: [v1]
      operationId: listCommunityPosts
      summary: Feed (public readable; removed posts moderator-only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Posts, content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createCommunityPost
      summary: Create a post (members only; 10 posts/hour/user)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                title: { type: string }
                body: { type: string }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/comments:
    get:
      tags: [v1]
      operationId: listPostComments
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Comments }
    post:
      tags: [v1]
      operationId: createPostComment
      summary: Comment on a post (members only)
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string } } }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Error" }
  /v1/posts/{postId}/reactions:
    post:
      tags: [v1]
      operationId: toggleReaction
      summary: Toggle a reaction on a post (members only)
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
