openapi: 3.1.0
info:
  title: AI Bookworm API
  version: 0.1.0
  description: Mandatory paths/schemas per MASTER-BUILD-SPEC section 9. All endpoints versioned under /v1.
servers:
  - url: http://localhost:3001
tags:
  - name: v1
paths:
  /v1/workspaces:
    get:
      tags: [v1]
      operationId: listWorkspaces
      summary: List visible workspaces
      responses:
        "200":
          description: Visible workspaces
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items:
                      type: object
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createWorkspace
      summary: Create workspace (org + workspace + member rows)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceRequest" }
      responses:
        "201":
          description: Created workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/books:
    get:
      tags: [v1]
      operationId: listBooks
      summary: List books
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Books in workspace
          content:
            application/json:
              schema:
                type: object
                required: [books]
                properties:
                  books:
                    type: array
                    items:
                      type: object
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createBook
      summary: Create book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookRequest" }
      responses:
        "201":
          description: Created book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/books/{bookId}/chapters:
    get:
      tags: [v1]
      operationId: listChapters
      summary: List chapters
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Chapters in book
          content:
            application/json:
              schema:
                type: object
                required: [chapters]
                properties:
                  chapters:
                    type: array
                    items:
                      type: object
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/chapters/{chapterId}/operations:
    post:
      tags: [v1]
      operationId: applyChapterOperation
      summary: Apply document operation (optimistic concurrency via expectedVersion)
      parameters:
        - name: chapterId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentOperation" }
      responses:
        "200":
          description: New document version
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/assets/upload-url:
    post:
      tags: [v1]
      operationId: createAssetUploadUrl
      summary: Create signed upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, filename, mimeType, sizeBytes]
              properties:
                workspaceId: { type: string, format: uuid }
                filename: { type: string, minLength: 1 }
                mimeType: { type: string, minLength: 1 }
                sizeBytes: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, assetId, storagePath]
                properties:
                  uploadUrl: { type: string }
                  assetId: { type: string, format: uuid }
                  storagePath: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /v1/assets/{assetId}/confirm:
    post:
      tags: [v1]
      operationId: confirmAssetUpload
      summary: Confirm upload and store checksum
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checksumSha256, sizeBytes]
              properties:
                checksumSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                sizeBytes: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Upload confirmed
          content:
            application/json:
              schema:
                type: object
                required: [assetId, status, confirmed]
                properties:
                  assetId: { type: string, format: uuid }
                  status: { type: string }
                  confirmed: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/ai/jobs:
    post:
      tags: [v1]
      operationId: createAiJob
      summary: Create AI job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAiJobRequest" }
      responses:
        "201":
          description: Created AI job
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/ai/jobs/{jobId}:
    get:
      tags: [v1]
      operationId: getAiJob
      summary: Get AI job
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: AI job
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/ai/suggestions/{id}/apply:
    post:
      tags: [v1]
      operationId: applyAiSuggestion
      summary: Apply suggestion
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Suggestion applied
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/publishing/validate:
    post:
      tags: [v1]
      operationId: runPreflight
      summary: Run deterministic preflight validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookId]
              properties:
                bookId: { type: string, format: uuid }
                editionId: { type: string, format: uuid }
      responses:
        "200":
          description: Preflight report
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }
  /v1/publishing/jobs:
    post:
      tags: [v1]
      operationId: createPublishingJob
      summary: Create publishing job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookId, channel, idempotencyKey]
              properties:
                bookId: { type: string, format: uuid }
                editionId: { type: string, format: uuid }
                channel: { type: string }
                request: { type: object }
                idempotencyKey: { type: string }
      responses:
        "201":
          description: Created publishing job
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/usage:
    get:
      tags: [v1]
      operationId: getUsage
      summary: Usage/credits
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }
  /v1/billing/checkout:
    post:
      tags: [v1]
      operationId: createBillingCheckout
      summary: Create checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, planId]
              properties:
                workspaceId: { type: string, format: uuid }
                planId: { type: string }
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema:
                type: object
                required: [checkoutUrl]
                properties:
                  checkoutUrl: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /v1/workspaces/{workspaceId}/folders:
    get:
      tags: [v1]
      operationId: listFolders
      summary: List folders (flat; client builds tree)
      parameters:
        - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Folders, content: { application/json: { schema: { type: object, required: [folders], properties: { folders: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createFolder
      summary: Create folder
      parameters:
        - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
                parentFolderId: { type: string, format: uuid, nullable: true }
      responses:
        "201": { description: Created folder, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/workspaces/{workspaceId}/folders/template:
    post:
      tags: [v1]
      operationId: seedFolderTemplate
      summary: Seed the 00_Admin..08_Archive book-project folder template (idempotent per name/level)
      parameters:
        - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Template seeded, content: { application/json: { schema: { type: object, required: [created, folders], properties: { created: { type: integer }, folders: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/folders/{folderId}:
    patch:
      tags: [v1]
      operationId: updateFolder
      summary: Rename and/or move folder (cycle-safe)
      parameters:
        - { name: folderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                parentFolderId: { type: string, format: uuid, nullable: true }
      responses:
        "200": { description: Updated folder, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/assets:
    get:
      tags: [v1]
      operationId: listAssets
      summary: List live assets (filter folder/type/status)
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: folderId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [draft, in_review, approved, rejected, archived] } }
      responses:
        "200": { description: Assets, content: { application/json: { schema: { type: object, required: [assets], properties: { assets: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/assets/{assetId}:
    patch:
      tags: [v1]
      operationId: updateAsset
      summary: Rename/move/change status of an asset
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                folderId: { type: string, format: uuid, nullable: true }
                status: { type: string, enum: [draft, in_review, approved, rejected, archived] }
      responses:
        "200": { description: Updated asset, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [v1]
      operationId: deleteAsset
      summary: Soft delete (status archived + deleted_at; row kept for audit)
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object, required: [assetId, deleted], properties: { assetId: { type: string }, deleted: { type: boolean } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/assets/{assetId}/restore:
    post:
      tags: [v1]
      operationId: restoreAsset
      summary: Restore a soft-deleted asset
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Restored, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/assets/{assetId}/versions:
    get:
      tags: [v1]
      operationId: listAssetVersions
      summary: Immutable version history (creator/time/checksum)
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Versions, content: { application/json: { schema: { type: object, required: [versions], properties: { versions: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createAssetVersion
      summary: Start a new immutable version; returns signed upload URL, checksum pending until confirm
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, mimeType, sizeBytes]
              properties:
                filename: { type: string, minLength: 1 }
                mimeType: { type: string, minLength: 1 }
                sizeBytes: { type: integer, minimum: 1 }
      responses:
        "200": { description: Signed upload URL for the new version, content: { application/json: { schema: { type: object, required: [assetId, version, uploadUrl, path], properties: { assetId: { type: string }, version: { type: integer }, uploadUrl: { type: string }, path: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/assets/{assetId}/versions/{version}/confirm:
    post:
      tags: [v1]
      operationId: confirmAssetVersion
      summary: Confirm a pending version checksum; asset row points at the new version
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checksumSha256]
              properties:
                checksumSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { description: Confirmed, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/assets/{assetId}/usage:
    get:
      tags: [v1]
      operationId: getAssetUsage
      summary: Where an asset is used (asset_links)
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Usage links, content: { application/json: { schema: { type: object, required: [links], properties: { links: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/comments:
    get:
      tags: [v1]
      operationId: listComments
      summary: Comments anchored to an entity
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: entityType, in: query, required: true, schema: { type: string } }
        - { name: entityId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Comments, content: { application/json: { schema: { type: object, required: [comments], properties: { comments: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createComment
      summary: Create entity-anchored comment; @name mentions resolved server-side into comment_mentions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, entityType, entityId, body]
              properties:
                workspaceId: { type: string, format: uuid }
                entityType: { type: string }
                entityId: { type: string, format: uuid }
                body: { type: string, minLength: 1 }
      responses:
        "201": { description: Created comment (+ mentioned user ids), content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/comments/{commentId}/resolve:
    post:
      tags: [v1]
      operationId: resolveComment
      summary: Toggle resolved state
      parameters:
        - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated comment, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/tasks:
    get:
      tags: [v1]
      operationId: listTasks
      summary: List tasks (filter status/assignee)
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [todo, in_progress, blocked, done, cancelled] } }
        - { name: assigneeId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Tasks, content: { application/json: { schema: { type: object, required: [tasks], properties: { tasks: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createTask
      summary: Create task (edit roles)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, title]
              properties:
                workspaceId: { type: string, format: uuid }
                title: { type: string, minLength: 1 }
                description: { type: string }
                entityType: { type: string }
                entityId: { type: string, format: uuid }
                assigneeId: { type: string, format: uuid, nullable: true }
                priority: { type: string, enum: [low, medium, high, urgent] }
                dueAt: { type: string, format: date-time, nullable: true }
      responses:
        "201": { description: Created task, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/tasks/{taskId}:
    patch:
      tags: [v1]
      operationId: updateTask
      summary: Update status/priority/due/assignee/title (edit roles)
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1 }
                status: { type: string, enum: [todo, in_progress, blocked, done, cancelled] }
                priority: { type: string, enum: [low, medium, high, urgent] }
                dueAt: { type: string, format: date-time, nullable: true }
                assigneeId: { type: string, format: uuid, nullable: true }
      responses:
        "200": { description: Updated task, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/approvals:
    get:
      tags: [v1]
      operationId: listApprovals
      summary: List approvals (filter status)
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, cancelled] } }
      responses:
        "200": { description: Approvals, content: { application/json: { schema: { type: object, required: [approvals], properties: { approvals: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createApproval
      summary: Request approval for an entity (edit roles)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, entityType, entityId]
              properties:
                workspaceId: { type: string, format: uuid }
                entityType: { type: string }
                entityId: { type: string, format: uuid }
                reviewerId: { type: string, format: uuid, nullable: true }
                comment: { type: string }
      responses:
        "201": { description: Created approval, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/approvals/{approvalId}/{action}:
    post:
      tags: [v1]
      operationId: resolveApproval
      summary: Approve or reject (pending only; 409 on double-resolve; reviewer+ roles)
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
      responses:
        "200": { description: Resolved approval, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/activity:
    get:
      tags: [v1]
      operationId: listActivity
      summary: Workspace activity timeline (most recent first)
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200, default: 50 } }
      responses:
        "200": { description: Activity events, content: { application/json: { schema: { type: object, required: [events], properties: { events: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/workspaces/{workspaceId}/members:
    get:
      tags: [v1]
      operationId: listMembers
      summary: Members + profile display names
      parameters:
        - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Members, content: { application/json: { schema: { type: object, required: [members, profiles], properties: { members: { type: array, items: { type: object } }, profiles: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/workspaces/{workspaceId}/invitations:
    post:
      tags: [v1]
      operationId: inviteMember
      summary: Invite by email (owner/admin) -> workspace_members status invited; email send is a stub
      parameters:
        - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [admin, editor, writer, illustrator, designer, reviewer, viewer], default: viewer }
      responses:
        "201": { description: Invitation row, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/workspaces/{workspaceId}/members/{userId}:
    patch:
      tags: [v1]
      operationId: updateMemberRole
      summary: Change member role (owner/admin; last owner cannot be demoted)
      parameters:
        - { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, editor, writer, illustrator, designer, reviewer, viewer] }
      responses:
        "200": { description: Updated member, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/plans:
    get:
      tags: [v1]
      operationId: listPlans
      summary: List subscription plans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans: { type: array, items: { $ref: "#/components/schemas/Plan" } }
        "401": { $ref: "#/components/responses/Error" }
  /v1/billing/checkout:
    post:
      tags: [v1]
      operationId: createBillingCheckout
      summary: Create Stripe checkout session (org admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, planId, successUrl, cancelUrl]
              properties:
                organizationId: { type: string, format: uuid }
                planId: { type: string, format: uuid }
                successUrl: { type: string, format: uri }
                cancelUrl: { type: string, format: uri }
      responses:
        "201":
          description: Checkout session
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkoutUrl: { type: string }
                  sessionId: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/billing/portal:
    post:
      tags: [v1]
      operationId: createBillingPortal
      summary: Create Stripe customer portal session (org admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, returnUrl]
              properties:
                organizationId: { type: string, format: uuid }
                returnUrl: { type: string, format: uri }
      responses:
        "200":
          description: Portal session
          content:
            application/json:
              schema:
                type: object
                properties: { portalUrl: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/usage:
    get:
      tags: [v1]
      operationId: getUsage
      summary: Current-month usage, entitlements, and credit balance
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlements: { type: object }
                  usage: { type: object, additionalProperties: { type: number } }
                  creditBalance: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/credits/deduct:
    post:
      tags: [internal]
      operationId: deductCredits
      summary: Service-to-service credit deduction (x-service-token, not user JWT)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, meter, amount, jobId]
              properties:
                userId: { type: string, format: uuid }
                workspaceId: { type: string, format: uuid, nullable: true }
                organizationId: { type: string, format: uuid, nullable: true }
                meter: { type: string }
                amount: { type: integer, minimum: 1 }
                jobId: { type: string, format: uuid }
      responses:
        "201": { description: Deduction posted, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/webhooks/stripe:
    post:
      tags: [internal]
      operationId: stripeWebhook
      summary: Stripe webhook (signature-verified, idempotent by event id)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Event received (duplicate events are no-ops) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateBookRequest:
      type: object
      required: [workspaceId, title, authorName]
      properties:
        workspaceId: { type: string, format: uuid }
        title: { type: string, minLength: 1 }
        subtitle: { type: string }
        authorName: { type: string, minLength: 1 }
        language: { type: string, default: en }
        genre: { type: string }
    CreateAiJobRequest:
      type: object
      required: [workspaceId, bookId, agentType, idempotencyKey]
      properties:
        workspaceId: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        agentType: { type: string }
        input: { type: object }
        idempotencyKey: { type: string }
    DocumentOperation:
      type: object
      required: [operationId, type, target, payload, expectedVersion]
      properties:
        operationId: { type: string }
        type: { type: string }
        target: { type: object }
        payload: { type: object }
        source: { type: string, enum: [human, ai] }
        sourceRef: { type: string }
        expectedVersion: { type: integer }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object }
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        orgName: { type: string, minLength: 1 }
        slug: { type: string }
    Workspace:
      type: object
      required: [id, organization_id, name, slug, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Plan:
      type: object
      required: [id, name, billing_period, price_cents, currency, entitlements_json]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        billing_period: { type: string }
        price_cents: { type: integer }
        currency: { type: string }
        entitlements_json: { type: object }
    Book:
      type: object
      required: [id, workspace_id, title, author_name, language, status, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        author_name: { type: string }
        language: { type: string }
        genre: { type: string, nullable: true }
        status: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
  responses:
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
security:
  - bearerAuth: []
