          application/json:
            schema:
              type: object
              required: [organizationId, planId, successUrl, cancelUrl]
              properties:
                organizationId: { type: string, format: uuid }
                planId: { type: string, format: uuid }
                successUrl: { type: string, format: uri }
                cancelUrl: { type: string, format: uri }
      responses:
        "201":
          description: Checkout session
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkoutUrl: { type: string }
                  sessionId: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/billing/portal:
    post:
      tags: [v1]
      operationId: createBillingPortal
      summary: Create Stripe customer portal session (org admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, returnUrl]
              properties:
                organizationId: { type: string, format: uuid }
                returnUrl: { type: string, format: uri }
      responses:
        "200":
          description: Portal session
          content:
            application/json:
              schema:
                type: object
                properties: { portalUrl: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/dashboard:
    get:
      tags: [v1]
      operationId: getDashboardOverview
      summary: Tenant-scoped author operations dashboard
      description: Returns books, aggregate assets/jobs/packages, paid usage, safe recent job labels, recent activity, and explicit retailer-sales provenance. Private job inputs and fabricated sales are never returned.
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current workspace dashboard
          headers:
            Cache-Control: { schema: { type: string }, description: Private no-store response }
          content:
            application/json:
              schema:
                type: object
                required: [workspace, books, summary, usage, recentJobs, activity, sales]
                properties:
                  workspace: { type: object }
                  books: { type: array, items: { $ref: "#/components/schemas/Book" } }
                  summary: { type: object }
                  usage: { type: object }
                  recentJobs: { type: array, items: { type: object } }
                  activity: { type: array, items: { type: object } }
                  sales: { $ref: "#/components/schemas/RetailerSalesSummary" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/sales/imports:
    get:
      tags: [v1]
      operationId: listRetailerSalesImports
      summary: Source-backed retailer sales imports for one workspace
      description: Lists immutable imported report receipts and currency-safe totals. Packages and preflights never become sales data.
      parameters:
        - { name: workspaceId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Private import history and summary
          headers:
            Cache-Control: { schema: { type: string }, description: Private no-store response }
          content:
            application/json:
              schema:
                type: object
                required: [imports, summary]
                properties:
                  imports: { type: array, items: { $ref: "#/components/schemas/RetailerSalesImport" } }
                  summary: { $ref: "#/components/schemas/RetailerSalesSummary" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: importRetailerSales
      summary: Import validated normalized rows from an author-selected retailer CSV
      description: The database derives a canonical source-report checksum and deduplicates exact reports. Source CSV bytes are not retained; each currency remains separate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, source, fileName, rows]
              properties:
                workspaceId: { type: string, format: uuid }
                source: { type: string, enum: [amazon_kdp, barnes_noble, apple_books, google_play, lulu, other] }
                fileName: { type: string, maxLength: 255 }
                supersedeImportId: { type: string, format: uuid, nullable: true }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    type: object
                    required: [soldOn, title, units, royaltyCents, currency]
                    properties:
                      bookId: { type: string, format: uuid, nullable: true }
                      soldOn: { type: string, format: date }
                      title: { type: string, maxLength: 500 }
                      externalId: { type: string, maxLength: 200, nullable: true }
                      marketplace: { type: string, maxLength: 100, nullable: true }
                      format: { type: string, maxLength: 100, nullable: true }
                      units: { type: integer }
                      reportedProceedsCents: { type: integer, nullable: true }
                      royaltyCents: { type: integer }
                      currency: { type: string, pattern: "^[A-Z]{3}$" }
      responses:
        "201": { description: Import receipt created, content: { application/json: { schema: { type: object } } } }
        "200": { description: Exact report already imported, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/usage:
    get:
      tags: [v1]
      operationId: getUsage
      summary: Current-month usage, entitlements, and credit balance
      parameters:
        - { name: organizationId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  entitlements: { type: object }
                  usage: { type: object, additionalProperties: { type: number } }
                  creditBalance: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/credits/deduct:
    post:
      tags: [internal]
      operationId: deductCredits
      summary: Service-to-service credit deduction (x-service-token, not user JWT)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, meter, amount, jobId]
              properties:
                userId: { type: string, format: uuid }
                workspaceId: { type: string, format: uuid, nullable: true }
                organizationId: { type: string, format: uuid, nullable: true }
                meter: { type: string }
                amount: { type: integer, minimum: 1 }
                jobId: { type: string, format: uuid }
      responses:
        "201": { description: Deduction posted, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/webhooks/stripe:
    post:
      tags: [internal]
      operationId: stripeWebhook
      summary: Stripe webhook (signature-verified, idempotent by event id)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Event received (duplicate events are no-ops) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/communities:
    get:
      tags: [v1]
      operationId: listCommunities
      summary: Discover communities (public + memberships)
      responses:
        "200": { description: Communities, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createCommunity
      summary: Create a community (slug unique; creator becomes owner)
      requestBody:
        required: true
        content:
