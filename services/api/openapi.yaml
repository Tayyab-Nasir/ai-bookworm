openapi: 3.1.0
info:
  title: AI Bookworm API
  version: 0.1.0
  description: Mandatory paths/schemas per MASTER-BUILD-SPEC section 9. All endpoints versioned under /v1.
servers:
  - url: http://localhost:3001
tags:
  - name: v1
paths:
  /v1/admin/access:
    get:
      operationId: adminAccess
      summary: Verify platform administrator access
      description: Requires a verified user listed in ADMIN_USER_IDS; workspace ownership alone is insufficient.
      responses:
        "200":
          description: Platform administrator
          content:
            application/json:
              schema: { type: object, required: [admin], properties: { admin: { type: boolean, const: true } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/users:
    get:
      operationId: adminListUsers
      summary: List user profiles and organization memberships (platform admin only)
      parameters:
        - { $ref: "#/components/parameters/AdminLimit" }
        - { $ref: "#/components/parameters/AdminOffset" }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
          description: Literal display-name substring or exact UUID.
      responses:
        "200": { description: "Object containing users, memberships, limit and offset." }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/jobs:
    get:
      operationId: adminListJobs
      summary: Inspect durable AI, publishing or manuscript-import jobs (platform admin only)
      parameters:
        - { $ref: "#/components/parameters/AdminLimit" }
        - { $ref: "#/components/parameters/AdminOffset" }
        - name: type
          in: query
          schema: { type: string, enum: [ai, publishing, document], default: ai }
        - name: status
          in: query
          schema: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
      responses:
        "200": { description: "Object containing jobs, type, limit and offset." }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/flags:
    get:
      operationId: adminListFlags
      summary: List feature flags across scopes (platform admin only)
      responses:
        "200": { description: Object containing flags ordered by key. }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/flags/{key}:
    put:
      operationId: adminSetFlag
      summary: Set a scoped feature flag and atomically record the audit event
      description: Platform administrators only. Omitted config preserves existing configuration. Null scope IDs share one unique global-scope record.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
                scopeType: { type: string, minLength: 1, maxLength: 40, default: global }
                scopeId: { type: [string, "null"], maxLength: 120, default: null }
                config: { type: object, additionalProperties: true }
      responses:
        "200": { description: Object containing the persisted flag. }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/admin/support:
    get:
      operationId: adminListSupport
      summary: List support tickets (platform admin only)
      parameters:
        - { $ref: "#/components/parameters/AdminLimit" }
        - { $ref: "#/components/parameters/AdminOffset" }
        - name: status
          in: query
          schema: { type: string, maxLength: 40 }
      responses:
        "200": { description: "Object containing tickets, limit and offset." }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/support/{id}:
    post:
      operationId: adminUpdateTicket
      summary: Change support-ticket status or priority (platform admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, pending, resolved, closed] }
                priority: { type: string, enum: [low, normal, high, urgent] }
      responses:
        "200": { description: Object containing the updated ticket. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/admin/audit:
    get:
      operationId: adminListAudit
      summary: Inspect audit events (platform admin only)
      parameters:
        - { $ref: "#/components/parameters/AdminLimit" }
        - { $ref: "#/components/parameters/AdminOffset" }
        - { name: entity, in: query, schema: { type: string, maxLength: 80 } }
        - { name: action, in: query, schema: { type: string, maxLength: 80 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: "Object containing entries, limit and offset." }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/usage/summary:
    get:
      operationId: adminUsageSummary
      summary: Aggregate a bounded usage sample by organization and meter
      description: Platform administrators only. Samples up to 10000 events and returns up to 50 organizations. Meter quantities have different units and should be displayed separately.
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        "200": { description: "Object containing days and orgs; each org includes organizationId, total and byMeter." }
        "403": { $ref: "#/components/responses/Error" }
  /v1/workspaces:
    get:
      tags: [v1]
      operationId: listWorkspaces
      summary: List visible workspaces
      responses:
        "200":
          description: Visible workspaces
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                properties:
                  workspaces:
                    type: array
                    items:
                      type: object
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createWorkspace
      summary: Create workspace (org + workspace + member rows)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceRequest" }
      responses:
        "201":
          description: Created workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/books:
    get:
      tags: [v1]
      operationId: listBooks
      summary: List books
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Books in workspace
          content:
            application/json:
              schema:
                type: object
                required: [books]
                properties:
                  books:
                    type: array
                    items:
                      type: object
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createBook
      summary: Create book
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookRequest" }
      responses:
        "201":
          description: Created book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/books/{bookId}/chapters:
    post:
      tags: [v1]
      operationId: createChapter
      summary: Create a chapter with optional replay protection
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 500 }
                nodes: { type: array, items: { type: object } }
                idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "201": { description: Created or recovered chapter; same actor/book/key replays identical input }
        "409": { description: Request key reused with different input }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    get:
      tags: [v1]
      operationId: listChapters
      summary: List chapters
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Chapters in book
          content:
            application/json:
              schema:
                type: object
                required: [chapters]
                properties:
                  chapters:
                    type: array
                    items:
                      type: object
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/books/{bookId}/import:
    post:
      tags: [v1]
      operationId: importManuscript
      summary: Import a clean private manuscript and its supported embedded images
      description: >-
        Requires editor access and a verified clean source in the same workspace.
        Accepts TXT, DOCX, EPUB and limited PDF sources up to 20 MiB. DOCX/EPUB
        raster images are independently verified and scanned before private upload.
        All new imports atomically persist chapters and a replay receipt, including
        assets for illustrated manuscripts. Completed retries return the receipt
        before parser configuration, scanning or storage downloads, but still
        require editor access and a clean current source with the saved checksum.
        Limits are 100 unique images, 10 MiB per image and 40 MiB total.
        No source bytes, embedded payloads or signed URLs are returned to the browser.
        Unsupported layout/image features are reported as warnings; originals remain intact.
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: string, format: uuid }
      responses:
        "200":
          description: Imported chapters or the saved import receipt on retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManuscriptImportResult"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/jobs/document/health:
    get:
      operationId: adminDocumentJobHealth
      summary: Read aggregate manuscript-import queue health (platform admin only)
      description: Returns counts and oldest active timestamps without manuscript, checksum, lease-token or provider payload data.
      responses:
        "200": { description: Aggregate document queue health snapshot. }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/books/{bookId}/imports/{assetId}:
    get:
      tags: [v1]
      operationId: getManuscriptImport
      summary: Read a previously completed manuscript import report
      description: >-
        Requires current book membership. Returns the saved historical result or
        null if no receipt exists, including imports made before receipt support.
        Does not parse, scan, download, create chapters or change source assets.
        Returns only allowlisted chapter metadata, IDs and report fields, with
        private no-store caching. A historical report does not approve the current
        source version or guarantee that imported chapters remain unchanged.
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Saved import result, or null
          content:
            application/json:
              schema:
                type: object
                required: [import]
                properties:
                  import:
                    oneOf:
                      - { $ref: "#/components/schemas/ManuscriptImportResult" }
                      - { type: "null" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/books/{bookId}/import-jobs:
    get:
      tags: [v1]
      operationId: listManuscriptImportJobs
      summary: List the latest durable manuscript import jobs for a book
      description: Book members receive at most 50 safe status records. Source checksums, lease tokens and private paths are never returned. Responses are private and not cached.
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Import job states
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/ManuscriptImportJob" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: queueManuscriptImport
      summary: Queue an idempotent durable import for a clean source manuscript
      description: Requires book editor access. The server revalidates actor membership, source workspace, clean current checksum, supported format and 20 MiB limit. Existing jobs are returned; an existing receipt makes the job immediately succeeded.
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: string, format: uuid }
      responses:
        "202":
          description: Existing or newly queued import job
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties: { job: { $ref: "#/components/schemas/ManuscriptImportJob" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/books/{bookId}/import-jobs/{jobId}/retry:
    post:
      tags: [v1]
      operationId: retryManuscriptImportJob
      summary: Requeue a failed manuscript import
      description: Requires editor access to the same book. Only failed jobs with an unchanged, still-clean original can restart. The retry is audited and resets the bounded attempt counter.
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Import job requeued
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties: { job: { $ref: "#/components/schemas/ManuscriptImportJob" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/books/{bookId}/search:
    post:
      tags: [v1]
      operationId: searchBookContext
      summary: Search the caller's current manuscript versions and optional Book Bible entries
      description: Tenant-scoped PostgreSQL full-text retrieval. Results are verbatim evidence with stable source citations; this endpoint does not generate an AI answer.
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookSearchRequest" }
      responses:
        "200":
          description: Ranked, cited source excerpts
          content:
            application/json:
              schema:
                type: object
                required: [results, strategy, query]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/BookSearchResult" }
                  strategy: { type: string, enum: [postgres_full_text] }
                  query: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/books/{bookId}/metadata/generate:
    post:
      tags: [v1]
      operationId: generateBookMetadataCandidate
      summary: Generate a cited, review-only metadata draft
      description: Uses bounded current manuscript versions and Book Bible evidence. The successful draft is audited on the AI job and consumes the applicable AI credit; it never updates book_metadata. An editor must explicitly save accepted fields through the metadata update endpoint.
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateBookMetadataRequest" }
      responses:
        "200":
          description: Idempotent replay of the existing metadata job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneratedBookMetadataResponse" }
        "201":
          description: Metadata candidate created for author review; canonical metadata is unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneratedBookMetadataResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/chapters/{chapterId}/operations:
    post:
      tags: [v1]
      operationId: applyChapterOperation
      summary: Apply document operation (optimistic concurrency via expectedVersion)
      parameters:
        - name: chapterId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentOperation" }
      responses:
        "200":
          description: New document version
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/assets/upload-url:
    post:
      tags: [v1]
      operationId: createAssetUploadUrl
      summary: Create signed upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceId, filename, mimeType, sizeBytes]
              properties:
                workspaceId: { type: string, format: uuid }
                filename: { type: string, minLength: 1 }
                mimeType: { type: string, minLength: 1 }
                sizeBytes: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, assetId, path]
                properties:
                  uploadUrl: { type: string }
                  assetId: { type: string, format: uuid }
                  path: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /v1/assets/{assetId}/confirm:
    post:
      tags: [v1]
      operationId: confirmAssetUpload
      summary: Verify stored bytes, scan for malware, and release a clean upload from quarantine
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checksumSha256, sizeBytes]
              properties:
                checksumSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                sizeBytes: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Upload confirmed
          content:
            application/json:
              schema:
                type: object
                required: [assetId, status, scanStatus, detectedMimeType, confirmed]
                properties:
                  assetId: { type: string, format: uuid }
                  status: { type: string }
                  scanStatus: { type: string, enum: [clean] }
                  detectedMimeType: { type: string }
                  confirmed: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/assets/generate:
    post:
      tags: [v1]
      operationId: generateImageAsset
      summary: Generate a private illustration or cover-art asset from saved book context
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateImageRequest" }
      responses:
        "201": { description: Generated asset and short-lived private preview }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/assets/{assetId}/download-url:
    get:
      tags: [v1]
      operationId: getPrivateAssetDownloadUrl
      summary: Create a short-lived private download URL for a completed asset
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Private signed URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresIn]
                properties:
                  url: { type: string, format: uri }
                  expiresIn: { type: integer, minimum: 1 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/ai/jobs:
    get:
      tags: [v1]
      operationId: listAiJobs
      summary: List saved text AI reviews for a book
      description: Returns a bounded, tenant-scoped review history. Raw prompts, idempotency keys, provider input and private retrieval contents are never returned.
      parameters:
        - name: bookId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        "200":
          description: Saved AI review summaries
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createAiJob
      summary: Create AI job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAiJobRequest" }
      responses:
        "201":
          description: Created AI job
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/ai/jobs/{jobId}:
    get:
      tags: [v1]
      operationId: getAiJob
      summary: Get AI job
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: AI job
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/ai/suggestions/{id}/apply:
    post:
      tags: [v1]
      operationId: applyAiSuggestion
      summary: Apply suggestion
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Suggestion applied
