      responses:
        "200": { description: Open reports }
  /v1/moderation/{reportId}/{action}:
    post:
      tags: [v1]
      operationId: moderateReport
      summary: Moderate a report (remove post | dismiss)
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [remove, dismiss] } }
      responses:
        "200": { description: Resolved report }
        "403": { $ref: "#/components/responses/Error" }
  /v1/referrals/code:
    get:
      tags: [v1]
      operationId: getReferralCode
      summary: Get (or auto-create) the caller's referral code
      responses:
        "200": { description: Referral code }
  /v1/referrals:
    get:
      tags: [v1]
      operationId: listReferrals
      summary: Referrals where the caller is referrer or referred
      responses:
        "200": { description: Referrals }
  /v1/referrals/ledger:
    get:
      tags: [v1]
      operationId: listCreditLedger
      summary: Caller's bounded immutable credit ledger and lifetime referral totals
      responses:
        "200":
          description: Ledger entries and server-calculated summary
          content:
            application/json:
              schema:
                type: object
                required: [entries, summary]
                properties:
                  entries: { type: array, items: { type: object } }
                  summary:
                    type: object
                    required: [creditBalance, referralCredits, rewardedReferrals]
                    properties:
                      creditBalance: { type: integer }
                      referralCredits: { type: integer }
                      rewardedReferrals: { type: integer, minimum: 0 }
  /v1/referrals/claim:
    post:
      tags: [v1]
      operationId: claimReferral
      summary: Attribute the caller to a referral code at signup
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        "201": { description: Attributed }
        "200": { description: Already attributed }
        "404": { $ref: "#/components/responses/Error" }
        "422": { description: Self-referral / inactive code }
  /v1/referrals/qualify:
    post:
      tags: [internal]
      operationId: qualifyReferral
      summary: Qualify a referral after a qualified action (service token). Anti-fraud may hold the reward for review. Idempotent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [referredUserId], properties: { referredUserId: { type: string, format: uuid } } }
      responses:
        "200": { description: Qualified (rewarded, held, or duplicate no-op) }
        "401": { $ref: "#/components/responses/Error" }
  /v1/referrals/{id}/review:
    post:
      tags: [v1]
      operationId: reviewReferral
      summary: Admin review of a held referral (approve posts the reward once)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [action], properties: { action: { type: string, enum: [approve, reject] } } }
      responses:
        "200": { description: Reviewed }
        "403": { $ref: "#/components/responses/Error" }
  /v1/referrals/{id}/reverse:
    post:
      tags: [v1]
      operationId: reverseReferral
      summary: Admin reversal (fraud/chargeback) — compensating negative ledger entry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Reversed }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/support/tickets:
    get:
      tags: [v1]
      operationId: listSupportTickets
      summary: List the caller's most recent support requests
      responses:
        "200":
          description: Support requests owned by the caller
          content:
            application/json:
              schema:
                type: object
                required: [tickets]
                properties:
                  tickets: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createSupportTicket
      summary: Submit a support request with server-controlled status and priority
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSupportTicketRequest" }
      responses:
        "201": { description: Support request created }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/account/data-requests:
    get:
      tags: [v1]
      operationId: listDataRightsRequests
      summary: List the caller's export and deletion requests
      responses:
        "200":
          description: Data-rights requests owned by the caller
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests: { type: array, items: { type: object } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: createDataRightsRequest
      summary: Submit a manually reviewed account-data export or deletion request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDataRightsRequest" }
      responses:
        "201": { description: Data-rights request submitted }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/account/data-requests/{requestId}:
    delete:
      tags: [v1]
      operationId: cancelDataRightsRequest
      summary: Cancel one of the caller's requests while it is still submitted
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Request cancelled }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/books/{bookId}/translations:
    get:
      tags: [v1]
      operationId: listTranslationProjects
      summary: List safe translation-project progress for a book
      description: Returns member-authorized project and chapter status only. It omits queued source text, source hashes, request keys and provider payloads.
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Translation projects, content: { application/json: { schema: { type: object, required: [projects], properties: { projects: { type: array, items: { type: object } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [v1]
      operationId: queueTranslationProject
      summary: Queue paid, version-pinned translation jobs for every saved chapter
      description: Requires editor access and an active plan with translation_credits_monthly. The queue retains immutable document pointers and hashes rather than manuscript text; provider work begins only when the private worker claims a job.
      parameters:
        - { name: bookId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetLanguage, idempotencyKey]
              properties:
                targetLanguage: { type: string, pattern: "^[a-z]{2,8}(-[a-z0-9]{2,8})*$", maxLength: 35 }
                idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "202": { description: Queued or idempotently recovered translation project }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/translations/{projectId}:
    get:
      tags: [v1]
      operationId: getTranslationProject
      summary: Read a member-authorized translation project
      description: Include translated text only with includeText=true. Results are private/no-store and never include source text stored by the queue.
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: includeText, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: Translation project and chapter results }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/translations/{projectId}/adopt:
    post:
      tags: [v1]
      operationId: adoptTranslationProject
      summary: Create a separate author-review draft from a completed translation
      description: Requires editor access. It never overwrites the source book, does not publish, and can be repeated safely for the same completed project.
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201": { description: Object containing the new translated-draft Book resource }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/audiobook-jobs/{projectId}/audio-download:
    get:
      tags: [v1]
      operationId: downloadAssembledAudiobookChapter
      summary: Assemble a completed, private narration project into one chapter MP3
      description: Verifies all stored segments and joins them in order without new AI generation. Requires RLS-visible completed narration. Limits are 250 parts, 100 MiB source audio, two hours decoded audio, 150 MiB output and 120 seconds native processing. Output is 44.1 kHz mono at 192 kbps; this is not retailer mastering or quality certification. Does not persist another asset.
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private, no-store chapter attachment
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  parameters:
    AdminLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    AdminOffset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RetailerSalesImport:
      type: object
      required: [id, workspace_id, source, file_name, row_count, period_start, period_end, supersedes_import_id, superseded_at, superseded_by, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        source: { type: string, enum: [amazon_kdp, barnes_noble, apple_books, google_play, lulu, other] }
        file_name: { type: string }
        row_count: { type: integer }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        supersedes_import_id: { type: string, format: uuid, nullable: true }
        superseded_at: { type: string, format: date-time, nullable: true }
        superseded_by: { type: string, format: uuid, nullable: true }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    RetailerSalesSummary:
      type: object
      required: [status, imports, latestImportedAt, units, reportedProceedsCents, royaltyCents, currency, currencies, available, message]
      properties:
        status: { type: string, enum: [not_connected, imported] }
        imports: { type: integer, minimum: 0 }
        latestImportedAt: { type: string, format: date-time, nullable: true }
        units: { type: integer, nullable: true }
        reportedProceedsCents: { type: integer, nullable: true }
        royaltyCents: { type: integer, nullable: true }
        currency: { type: string, nullable: true }
        currencies:
          type: array
          items:
            type: object
            required: [currency, units, reportedProceedsCents, royaltyCents]
            properties:
              currency: { type: string }
              units: { type: integer }
              reportedProceedsCents: { type: integer, nullable: true }
              royaltyCents: { type: integer }
        available: { type: boolean, description: True when retailer-sales tables and RPCs are installed in this environment. }
        message: { type: string }
    ManuscriptImportJob:
      type: object
      required: [id, book_id, source_asset_id, status, attempts, error_code, created_at, available_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        book_id: { type: string, format: uuid }
        source_asset_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        attempts: { type: integer, minimum: 0, maximum: 5 }
        error_code: { type: string, nullable: true, maxLength: 80 }
        created_at: { type: string, format: date-time }
        available_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    ManuscriptImportResult:
      type: object
      required: [chapters, sourceAssetId, assetIds, report]
      properties:
        chapters: { type: array, minItems: 1, maxItems: 500, items: { type: object } }
        sourceAssetId: { type: string, format: uuid }
        assetIds: { type: array, maxItems: 100, items: { type: string, format: uuid } }
        report:
          type: object
          required: [warnings, chapterCount, imageCount]
          properties:
            warnings: { type: array, maxItems: 100, items: { type: string, maxLength: 2000 } }
            chapterCount: { type: integer, minimum: 1, maximum: 500 }
            imageCount: { type: integer, minimum: 0, maximum: 100 }
            confidence: { type: string, maxLength: 100 }
    RetailerChannel:
      type: string
      enum: [kdp, apple, barnesnoble, lulu]
    PreflightResult:
      type: object
      required: [jobId, ruleVersion, channel, requestedChannel, errors, warnings, findings]
      properties:
        jobId: { type: string, format: uuid }
        ruleVersion: { type: string }
        channel: { type: string, nullable: true }
        requestedChannel: { type: string, enum: [export, kdp, apple, barnesnoble, lulu] }
        errors: { type: integer, minimum: 0 }
        warnings: { type: integer, minimum: 0 }
        findings: { type: array, items: { type: object } }
    PublishingPackageJob:
      type: object
      required: [id, bookId, editionId, channel, status, createdAt, sourceRenderJobId, sourcePreflightJobId, failureCode, submissionMode, package]
      properties:
        id: { type: string, format: uuid }
        bookId: { type: string, format: uuid }
        editionId: { type: string, format: uuid }
        channel: { $ref: "#/components/schemas/RetailerChannel" }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        sourceRenderJobId: { type: string, format: uuid, nullable: true }
        sourcePreflightJobId: { type: string, format: uuid, nullable: true }
        ruleVersion: { type: string, nullable: true }
        failureCode: { type: string, nullable: true }
        submissionMode: { type: string, enum: [manual] }
        package:
          nullable: true
          type: object
          required: [asset, download]
          properties:
            asset: { type: object }
            download:
              type: object
              required: [url, expiresIn]
              properties:
                url: { type: string, format: uri }
                expiresIn: { type: integer, minimum: 1 }
    CreateBookRequest:
      type: object
      required: [workspaceId, title, authorName]
      properties:
        workspaceId: { type: string, format: uuid }
        title: { type: string, minLength: 1 }
        subtitle: { type: string }
        authorName: { type: string, minLength: 1 }
        language: { type: string, default: en }
        genre: { type: string }
    GenerateImageRequest:
      type: object
      additionalProperties: false
      required: [workspaceId, kind, name, prompt, idempotencyKey]
      properties:
        workspaceId: { type: string, format: uuid }
        bookId: { type: string, format: uuid, nullable: true }
        folderId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [illustration, front_cover] }
        name: { type: string, minLength: 1, maxLength: 256 }
        prompt: { type: string, minLength: 10, maxLength: 4000 }
        size: { type: string, enum: [1024x1024, 1024x1536, 1536x1024], default: 1024x1024 }
        quality: { type: string, enum: [low, medium, high], default: medium }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
    CreateSupportTicketRequest:
      type: object
      additionalProperties: false
      required: [category, subject, body]
      properties:
        category: { type: string, enum: [general, technical, billing, publishing, account, privacy] }
        subject: { type: string, minLength: 3, maxLength: 160 }
        body: { type: string, minLength: 10, maxLength: 5000 }
    CreateDataRightsRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [export, delete] }
        reason: { type: string, maxLength: 2000 }
        confirmation:
          type: string
          maxLength: 40
          description: Must be exactly DELETE MY ACCOUNT when type is delete.
    CreateAiJobRequest:
      type: object
      required: [bookId, chapterIds, agentType, idempotencyKey]
      properties:
        bookId: { type: string, format: uuid }
        chapterIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: uuid }
        agentType: { type: string, enum: [writer, proofreader, copyeditor, consistency] }
        userInstruction: { type: string, minLength: 1, maxLength: 4000 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
        contextPolicy:
          type: object
          additionalProperties: false
          properties:
            includeBookBible: { type: boolean, default: true }
            includeStyleGuide: { type: boolean, default: true }
            includeRelatedContext:
              type: boolean
              default: true
              description: Retrieve cited, current book sources for writer and consistency jobs.
            semanticTopK: { type: integer, minimum: 1, maximum: 20, default: 5 }
            maxTokens: { type: integer, minimum: 256, maximum: 16000, default: 4096 }
    GenerateBookMetadataRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
        chapterIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          description: Optional author-selected chapters; otherwise the first five current chapters are sampled.
          items: { type: string, format: uuid }
        audience: { type: string, minLength: 1, maxLength: 500 }
        tone: { type: string, minLength: 1, maxLength: 200 }
        maxTokens: { type: integer, minimum: 4096, maximum: 16000, default: 12000 }
    MetadataSourceRef:
      type: object
      additionalProperties: false
      required: [chapterId, nodeId]
      properties:
        chapterId: { type: string, format: uuid }
        documentVersionId: { type: string, format: uuid }
        nodeId: { type: string, minLength: 1, maxLength: 200 }
        textHash: { type: string, pattern: "^[a-f0-9]{64}$" }
    GeneratedBookMetadataCandidate:
      type: object
      additionalProperties: false
      required: [suggestionKind, description, keywords, categories, audience, rationale, confidence, sourceRefs, status]
      properties:
        suggestionKind: { type: string, enum: [metadata_candidate] }
        description: { type: string, minLength: 40, maxLength: 4000 }
        keywords:
          type: array
          minItems: 1
          maxItems: 30
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 100 }
        categories:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 180 }
        audience: { type: string, minLength: 1, maxLength: 500 }
        rationale: { type: string, minLength: 1, maxLength: 2000 }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        sourceRefs:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: "#/components/schemas/MetadataSourceRef" }
        status: { type: string, enum: [pending] }
    GeneratedBookMetadataResponse:
      type: object
      required: [job, candidate]
      properties:
        job: { type: object }
        candidate: { $ref: "#/components/schemas/GeneratedBookMetadataCandidate" }
    BookSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 1000 }
        limit: { type: integer, minimum: 1, maximum: 20, default: 8 }
        chapterIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }
        includeBible: { type: boolean, default: true }
    BookSearchResult:
      type: object
      required: [id, source_type, chunk_index, excerpt, text_hash, score]
      properties:
        id: { type: string, format: uuid }
        source_type: { type: string, enum: [manuscript, bible] }
        chapter_id: { type: string, format: uuid, nullable: true }
        bible_item_id: { type: string, format: uuid, nullable: true }
        document_version_id: { type: string, format: uuid, nullable: true }
        node_id: { type: string, nullable: true }
        chunk_index: { type: integer, minimum: 0 }
        title: { type: string, nullable: true }
        excerpt: { type: string }
        text_hash: { type: string }
        score: { type: number }
    DocumentOperation:
      type: object
      required: [operationId, type, target, payload, expectedVersion]
      properties:
        operationId: { type: string }
        type: { type: string }
        target: { type: object }
        payload: { type: object }
        source: { type: string, enum: [human, ai] }
        sourceRef: { type: string }
        expectedVersion: { type: integer }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object }
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        orgName: { type: string, minLength: 1 }
        slug: { type: string }
    Workspace:
      type: object
      required: [id, organization_id, name, slug, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkspaceInvitation:
      type: object
      required: [id, workspace_id, email, role, status, expires_at, invited_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, editor, writer, illustrator, designer, reviewer, viewer] }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expires_at: { type: string, format: date-time }
        invited_by: { type: string, format: uuid }
        accepted_by: { type: string, format: uuid, nullable: true }
        accepted_at: { type: string, format: date-time, nullable: true }
        revoked_by: { type: string, format: uuid, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Plan:
      type: object
      required: [id, name, billing_period, price_cents, currency, entitlements_json]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        billing_period: { type: string }
        price_cents: { type: integer }
        currency: { type: string }
        entitlements_json: { type: object }
    Book:
      type: object
      required: [id, workspace_id, title, author_name, language, status, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        author_name: { type: string }
        language: { type: string }
        genre: { type: string, nullable: true }
        status: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
  responses:
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
security:
  - bearerAuth: []
