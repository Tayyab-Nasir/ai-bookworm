name: Native author files acceptance
on:
  workflow_dispatch:
  pull_request:
    paths: ['package.json', 'package-lock.json', 'apps/web/**', 'services/api/**', 'packages/**', 'supabase/migrations/**', 'services/document/**', 'services/scanning/**', 'services/rendering/**', 'services/publishing/**', 'ops/native-author-files/**', 'ops/scanner-test/**', 'ops/processing.Dockerfile', 'tests/e2e/*native-author-files*', 'tests/native-author-files-guard.test.mjs', '.github/workflows/author-files-runtime.yml']
  push:
    branches: [main, master, 'codex/**']
    paths: ['package.json', 'package-lock.json', 'apps/web/**', 'services/api/**', 'packages/**', 'supabase/migrations/**', 'services/document/**', 'services/scanning/**', 'services/rendering/**', 'services/publishing/**', 'ops/native-author-files/**', 'ops/scanner-test/**', 'ops/processing.Dockerfile', 'tests/e2e/*native-author-files*', 'tests/native-author-files-guard.test.mjs', '.github/workflows/author-files-runtime.yml']
permissions:
  contents: read
jobs:
  author-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.120.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/native-author-files-guard.test.mjs
      - name: Install isolated browser runtime
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify inert reader and browser-worker isolation
        run: node tests/e2e/native-author-files-browser-guard.mjs
      - name: Verify inline previews and attachment downloads in full Chromium
        env:
          BROWSER_TEST_CHANNEL: chromium
        run: node --test apps/web/tests/saved-print-mounted.mjs
      - name: Verify manuscript recovery and imported structure in full Chromium
        env:
          BROWSER_TEST_CHANNEL: chromium
        run: node --import tsx --test apps/web/tests/editor-numbering-mounted.mjs
      - name: Build production author interface
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          BOOKWORM_DIST_DIR: .next-native-author
        run: node node_modules/next/dist/bin/next build apps/web
      - name: Build existing private scanner, document, rendering and publishing runtimes
        run: |
          docker build -t bookworm-ci-scanner services/scanning
          docker build -t bookworm-ci-clamd ops/scanner-test
          docker build -f ops/processing.Dockerfile --target document -t bookworm-ci-document .
          docker build -f ops/processing.Dockerfile --target rendering -t bookworm-ci-rendering .
          docker build -f ops/processing.Dockerfile --target publishing -t bookworm-ci-publishing .
      - name: Verify native authoring, saved proofs and private retailer packages
        env:
          BOOKWORM_NATIVE_AUTHOR_TEST: '1'
        run: node tests/e2e/run-native-author-files.mjs
      - name: Retain synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-author-browser-${{ github.sha }}
          path: .git/bookworm-native-browser/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
