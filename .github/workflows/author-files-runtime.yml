name: Native author files acceptance
on:
  workflow_dispatch:
  pull_request:
    paths: ['package.json', 'package-lock.json', 'services/api/**', 'packages/**', 'supabase/migrations/**', 'services/document/**', 'services/scanning/**', 'ops/native-author-files/**', 'ops/scanner-test/**', 'ops/processing.Dockerfile', 'tests/e2e/*native-author-files*', 'tests/native-author-files-guard.test.mjs', '.github/workflows/author-files-runtime.yml']
  push:
    branches: [main, master, 'codex/**']
    paths: ['package.json', 'package-lock.json', 'services/api/**', 'packages/**', 'supabase/migrations/**', 'services/document/**', 'services/scanning/**', 'ops/native-author-files/**', 'ops/scanner-test/**', 'ops/processing.Dockerfile', 'tests/e2e/*native-author-files*', 'tests/native-author-files-guard.test.mjs', '.github/workflows/author-files-runtime.yml']
permissions:
  contents: read
jobs:
  author-files:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.120.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/native-author-files-guard.test.mjs
      - name: Build existing private scanner and document runtimes
        run: |
          docker build -t bookworm-ci-scanner services/scanning
          docker build -t bookworm-ci-clamd ops/scanner-test
          docker build -f ops/processing.Dockerfile --target document -t bookworm-ci-document .
      - name: Verify real Auth, PostgREST, Storage, scanner and import worker
        env:
          BOOKWORM_NATIVE_AUTHOR_TEST: '1'
        run: node tests/e2e/run-native-author-files.mjs
