name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure checksum-pinned EPUBCheck
        shell: bash
        run: |
          BOOKWORM_EPUBCHECK_DIR="$RUNNER_TEMP/bookworm-epubcheck"
          mkdir -p "$BOOKWORM_EPUBCHECK_DIR"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 10 --max-time 120 \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip \
            --output "$BOOKWORM_EPUBCHECK_DIR/epubcheck.zip"
          printf '%s  %s\n' '33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c' \
            "$BOOKWORM_EPUBCHECK_DIR/epubcheck.zip" | sha256sum --check
          unzip -q "$BOOKWORM_EPUBCHECK_DIR/epubcheck.zip" -d "$BOOKWORM_EPUBCHECK_DIR"
          echo "EPUBCHECK_JAR=$BOOKWORM_EPUBCHECK_DIR/epubcheck-5.4.0/epubcheck.jar" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install Python service dependencies
        run: >-
          python -m pip install
          -r services/ai/requirements.txt
          -r services/document/requirements.txt
          -r services/rendering/requirements.txt
          -r services/publishing/requirements.txt
          -r services/scanning/requirements.txt
      - run: npm run verify
      - run: npm run build

  flutter-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
