name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: npm ci
      - name: Install Python service dependencies
        run: >-
          python -m pip install
          -r services/ai/requirements.txt
          -r services/document/requirements.txt
          -r services/rendering/requirements.txt
          -r services/publishing/requirements.txt
          -r services/scanning/requirements.txt
      - run: npm run verify
      - run: npm run build

  flutter-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
